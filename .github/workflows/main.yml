name: Build Xbox Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly
          

      - name: Build Rust adblock engine
        working-directory: native/adblock_engine
        run: rustup run nightly cargo build --release -Z build-std=std,panic_abort --target x86_64-uwp-windows-msvc
        continue-on-error: false

      - name: Check Rust build output
        working-directory: native/adblock_engine
        run: |
          if (Test-Path "target/x86_64-uwp-windows-msvc/release/adblock_engine.lib") {
            echo "RUST_OK=true" >> $env:GITHUB_ENV
          } else {
            echo "RUST_OK=false" >> $env:GITHUB_ENV
          }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore App/App.sln


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
    
      - name: List installed Windows SDKs
        run: |
         Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object Name
   
      - name: Check CppWinRT package contents
        shell: pwsh
        run: |
          Get-ChildItem "App\packages\Microsoft.Windows.CppWinRT.2.0.240405.15" -Recurse -Filter "cppwinrt.exe"


      - name: Build UWP App
        run: msbuild App/App.sln /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64" /p:AppxPackageSigningEnabled=false /p:UapAppxPackageBuildMode=SideloadOnly
   
      - name: List all generated files
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "App\Generated Files" -Recurse -File | Select-Object Name, FullName

      - name: Dump App.xaml.g.h on failure
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "App\Generated Files\App.xaml.g.h") {
            Get-Content "App\Generated Files\App.xaml.g.h"
          } else {
            echo "App.xaml.g.h not found"
          }

      - name: Dump App.g.h (component header) on failure
        if: always()
        shell: pwsh
        run: |
          $f = Get-ChildItem "App\Generated Files" -Recurse -File -Filter "App.g.h" | Select-Object -First 1
          if ($f) {
            echo "Found: $($f.FullName)"
            Get-Content $f.FullName
          } else {
            echo "App.g.h not found anywhere under Generated Files"
          }

      - name: Search for winrt_make_XboxBrave_App definition
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "App\Generated Files" -Recurse -File -Include *.h,*.hpp,*.cpp | Select-String -Pattern "winrt_make_XboxBrave_App|DISABLE_XAML_GENERATED_MAIN|__cdecl main" | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line)" }

      - name: Upload appx
        uses: actions/upload-artifact@v4
        with:
          name: XboxBrave-appx
          path: App/AppPackages/**/*.appx
          if-no-files-found: warn
